version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres-univer
    environment:
      POSTGRES_DB: univerdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-keycloak/init-keycloak-db.sql:/docker-entrypoint-initdb.d/init-keycloak-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5


  keycloak:
    image: quay.io/keycloak/keycloak:22.0.1
    container_name: keycloak-univer
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak        # Явно указываем имя БД
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: true
      KC_LOG_LEVEL: INFO
      # Для запуска на реальном устройстве (issue #127) — адрес Mac в LAN, иначе форма логина отправляется
      # на localhost телефона: `KC_HOSTNAME=192.168.1.42 docker compose up`. Этот же адрес должен быть в SAN
      # сертификата (init-keycloak/certs/generate.sh). iss токенов бэкенд не проверяет (см. MOBILE.md).
      KC_HOSTNAME: ${KC_HOSTNAME:-localhost}
      # KC_HOSTNAME_PORT намеренно не фиксируем: он раньше жёстко приклеивал 8082 ко всем сгенерированным
      # URL (включая форму логина), из-за чего при заходе через HTTPS (8443) форма логина всё равно
      # указывала на https://localhost:8082 — порт, где реально слушает только HTTP. Без фиксации
      # Keycloak берёт схему/порт из Host-заголовка конкретного запроса, поэтому 8082 (HTTP) и 8443
      # (HTTPS, issue #54) корректно работают одновременно.
      # Важно: указываем путь к realm-файлу
      KC_IMPORT: /opt/keycloak/data/import/realm-config.json
      KC_IMPORT_FORCE: true
      # HTTPS нужен только для браузерных флоу логина (Authorization Code + PKCE, см. MOBILE.md,
      # issue #54) — Keycloak всегда отдаёт сессионную cookie AUTH_SESSION_ID с флагом Secure, который
      # браузер по чистому HTTP отбрасывает. Password grant (SCENARIOS.md, Swagger UI) cookie не
      # использует и продолжает работать по HTTP на 8082, поэтому issuer-uri/auth-server-url в
      # application.yml не меняются. Сертификат самоподписанный, только для локальной разработки —
      # см. init-keycloak/certs/README.md.
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/certs/keycloak-dev.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/certs/keycloak-dev.key
      KC_HTTPS_PORT: 8443
    command: [ "start-dev", "--import-realm" ]
    ports:
      - "8082:8080"
      - "8443:8443"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./init-keycloak/realm-config.json:/opt/keycloak/data/import/realm-config.json
      - ./init-keycloak/certs:/opt/keycloak/certs:ro
    links:
      - postgres
    # В образе нет curl/wget — проверяем /health/ready через bash /dev/tcp (KC_HEALTH_ENABLED выше)
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Сам бэкенд. В профиле app, чтобы обычный `docker compose up` поднимал только Postgres+Keycloak и не
  # занимал 8023 при запуске приложения из IDE. Полный стек: `docker compose --profile app up --build`
  app:
    build: .
    # Как в coungard/delivery-club: репозиторий — проект, тег — сервис
    image: coungard/univer:backend
    container_name: univer-app
    profiles: [ "app" ]
    environment:
      # Внутри сети compose сервисы доступны по именам, localhost:5435/8082 — только с хоста
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/univerdb
      # JwtDecoder берёт отсюда только JWKS, claim iss не проверяет (см. SecurityConfig.jwtDecoder) —
      # поэтому токены, выданные клиенту через localhost:8082, приложение принимает
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/univer-realm
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      # tokenUrl Swagger UI открывается из браузера, поэтому адрес с хоста
      KEYCLOAK_PUBLIC_URL: http://localhost:8082
      # Медиа-файлы (issue #136) — в volume, чтобы переживали пересоздание контейнера; отдаёт их само приложение
      MEDIA_STORAGE_DIR: /data/media
    volumes:
      - media_data:/data/media
    ports:
      - "8023:8023"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

volumes:
  postgres_data:
  media_data: